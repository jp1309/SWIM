<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swanson Swim Team Dashboard</title>
<style>
  :root {
    --navy: #1a2744;
    --gold: #c9a84c;
    --light: #f4f6f9;
    --white: #fff;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
    --gray: #7f8c8d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--light); color: #333; }

  header {
    background: var(--navy);
    color: var(--white);
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  header h1 { font-size: 1.6rem; }
  header h1 span { color: var(--gold); }
  .header-stats { display: flex; gap: 2rem; font-size: 0.9rem; opacity: 0.85; }

  nav {
    background: var(--white);
    border-bottom: 2px solid var(--gold);
    display: flex;
    gap: 0;
    overflow-x: auto;
  }
  nav button {
    padding: 0.8rem 1.5rem;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--gray);
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }
  nav button:hover { color: var(--navy); }
  nav button.active { color: var(--navy); border-bottom-color: var(--gold); }

  main { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }

  .section { display: none; }
  .section.active { display: block; }

  /* Cards grid */


  /* Tables */
  .table-wrapper {
    background: var(--white);
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    overflow-x: auto;
    margin-bottom: 1.5rem;
  }
  .table-wrapper h2 {
    padding: 1rem 1.2rem 0.5rem;
    font-size: 1.1rem;
    color: var(--navy);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  th {
    background: var(--navy);
    color: var(--white);
    padding: 0.6rem 0.8rem;
    text-align: left;
    font-weight: 500;
    position: sticky;
    top: 0;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { background: #243b5e; }
  td {
    padding: 0.5rem 0.8rem;
    border-bottom: 1px solid #eee;
    white-space: nowrap;
  }
  tr:hover td { background: #f0f4ff; }
  tr.dq td { color: var(--red); text-decoration: line-through; opacity: 0.7; }
  .time-best { color: var(--green); font-weight: 600; }
  .time-improve { color: var(--blue); }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
    align-items: center;
  }
  .filters label { font-size: 0.85rem; font-weight: 500; color: var(--navy); }
  .filters select, .filters input {
    padding: 0.4rem 0.6rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.88rem;
  }

  /* Best times highlight */
  .best-badge {
    display: inline-block;
    background: var(--green);
    color: white;
    font-size: 0.7rem;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    font-weight: 600;
    margin-left: 0.3rem;
  }
  .pb-badge {
    display: inline-block;
    background: var(--blue);
    color: white;
    font-size: 0.7rem;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    font-weight: 600;
    margin-left: 0.3rem;
  }

  /* Finals selection */
  .finals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 1rem; }
  .finals-event {
    background: var(--white);
    border-radius: 8px;
    padding: 1rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .finals-event h3 {
    color: var(--navy);
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid var(--gold);
  }
  .finals-event .rank { width: 28px; text-align: center; font-weight: 700; color: var(--navy); }
  .finals-event td.selected { background: #e8f5e9; }
  .finals-event tr.recommended td { }

  .trend-dot {
    width: 6px; height: 6px; border-radius: 50%;
    display: inline-block;
  }

  .print-btn {
    padding: 0.5rem 1.2rem;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .print-btn:hover { background: #243b5e; }

  @media print {
    nav, .filters, .print-btn, header { display: none !important; }
    .section { display: block !important; }
    .table-wrapper { break-inside: avoid; }
  }

  /* ── CHAMPIONSHIP TAB ── */
  .champ-hero {
    background: linear-gradient(135deg, var(--navy) 60%, #2a3f6e);
    color: var(--white);
    border-radius: 12px;
    padding: 2rem 2.5rem;
    display: flex; align-items: center; gap: 2rem; flex-wrap: wrap;
    margin-bottom: 1.5rem;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
  }
  .champ-trophy { font-size: 4rem; line-height: 1; }
  .champ-title { flex: 1; }
  .champ-title h2 { font-size: 1.8rem; color: var(--gold); font-weight: 800; }
  .champ-title p  { font-size: .92rem; opacity: .8; margin-top: .3rem; }
  .champ-score-box {
    background: rgba(255,255,255,.1); border-radius: 10px;
    padding: 1rem 1.5rem; text-align: center; min-width: 130px;
  }
  .champ-score-box .big { font-size: 2.2rem; font-weight: 900; color: var(--gold); }
  .champ-score-box .lbl { font-size: .78rem; opacity: .7; margin-top: .2rem; }

  /* standings */
  .standings-table { width: 100%; border-collapse: collapse; background: var(--white);
    border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    margin-bottom: 1.5rem; font-size: .9rem; }
  .standings-table th { background: var(--navy); color: var(--white); padding: .6rem 1rem;
    text-align: left; font-weight: 600; }
  .standings-table td { padding: .6rem 1rem; border-bottom: 1px solid #eee; }
  .standings-table tr:last-child td { border: none; }
  .standings-table tr.row-swanson td { background: #fffbef; font-weight: 700; }
  .bar-bg { background: #eef0f3; border-radius: 99px; height: 14px; overflow: hidden; width: 180px; }
  .bar-fg { height: 100%; border-radius: 99px; }

  /* school dot */
  .sdot { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }

  /* podium */
  .podium-wrap { display: flex; justify-content: center; align-items: flex-end; gap: 0; margin-bottom: 2rem; max-width: 520px; }
  .pod { display: flex; flex-direction: column; align-items: center; width: 170px; }
  .pod-name { font-weight: 700; font-size: .9rem; color: var(--navy); margin-bottom: .3rem; text-align: center; }
  .pod-pts { font-size: 1.4rem; font-weight: 800; line-height: 1; }
  .pod-sub { font-size: .72rem; color: var(--gray); margin-bottom: .4rem; }
  .pod-stand { width: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 900; color: var(--white); border-radius: 8px 8px 0 0; }
  .pod-1 { height: 130px; background: var(--gold); }
  .pod-2 { height: 90px; background: #95a5a6; }
  .pod-3 { height: 65px; background: #cd7f32; }

  /* event bar charts */
  .ev-charts-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); gap: 1rem;
    margin-top: 1rem;
  }
  .ev-chart-card { background: var(--white); border-radius: 8px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .ev-chart-head { background: var(--navy); color: var(--white); padding: .5rem 1rem;
    display: flex; justify-content: space-between; align-items: center; }
  .ev-chart-head .ech-name { font-weight: 700; font-size: .88rem; }
  .ev-chart-head .ech-ev   { font-size: .74rem; opacity: .65; }
  .ev-chart-body { padding: .7rem .9rem; }
  .ch-bar-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .38rem; }
  .ch-bar-row:last-child { margin-bottom: 0; }
  .ch-place { width: 20px; text-align: center; font-size: .78rem; font-weight: 800; flex-shrink: 0; color: var(--gray); }
  .ch-place.g1 { color: #c9a84c; } .ch-place.g2 { color: #95a5a6; } .ch-place.g3 { color: #cd7f32; }
  .ch-name  { width: 122px; font-size: .76rem; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex-shrink: 0; font-weight: 500; }
  .ch-name.swan { font-weight: 700; color: var(--navy); }
  .ch-track { flex: 1; height: 20px; background: #f0f2f5; border-radius: 4px; overflow: hidden; position: relative; }
  .ch-fill  { height: 100%; border-radius: 4px; display: flex; align-items: center;
    padding-left: 5px; font-size: .67rem; font-weight: 700; color: rgba(255,255,255,.88);
    white-space: nowrap; overflow: hidden; }
  .ch-fill.swan-border { outline: 2px solid var(--navy); outline-offset: -2px; }
  .ch-time  { width: 50px; text-align: right; font-size: .76rem; font-family: monospace;
    font-weight: 600; color: var(--navy); flex-shrink: 0; }

  /* swimmers grid */
  .champ-swimmers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1rem; margin-top: 1rem; }
  .csw-card { background: var(--white); border-radius: 8px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); border-top: 4px solid var(--navy); }
  .csw-card.gold { border-top-color: var(--gold); }
  .csw-name { padding: .65rem 1rem .25rem; font-weight: 700; font-size: .95rem; color: var(--navy); }
  .csw-events { padding: 0 1rem .6rem; }
  .csw-row { display: flex; align-items: center; gap: .4rem; padding: .28rem 0;
    border-bottom: 1px solid #f0f2f5; font-size: .82rem; }
  .csw-row:last-child { border-bottom: none; }
  .csw-ev-name { flex: 1; }
  .badge { display: inline-block; border-radius: 99px; padding: .1rem .45rem;
    font-weight: 700; font-size: .73rem; color: var(--white); }
  .b1 { background: var(--gold); color: var(--navy); }
  .b2 { background: #95a5a6; }
  .b3 { background: #cd7f32; }
  .bx { background: var(--navy); }
  .csw-time { font-family: monospace; font-size: .82rem; font-weight: 600; }
  .csw-pts  { font-size: .75rem; color: var(--gray); }
  .csw-footer { padding: .35rem 1rem .55rem; background: #f8f9fa; font-size: .8rem; color: var(--gray); }
  .csw-footer strong { color: var(--navy); }

  /* legend */
  .champ-legend { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin-bottom: 1rem; }
  .champ-legend-item { display: flex; align-items: center; gap: .35rem; font-size: .8rem; font-weight: 600; }

  .swimmer-link { color: var(--blue); cursor: pointer; text-decoration: underline; }
  .swimmer-link:hover { color: var(--navy); }

  /* Swimmer profile modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center;
    align-items: flex-start;
    padding-top: 5vh;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 8px;
    width: 90%;
    max-width: 800px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 1.5rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .modal h2 { color: var(--navy); margin-bottom: 1rem; }
  .modal-close {
    float: right;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--gray);
  }
</style>
</head>

<header>
  <img src="https://swanson.apsva.us/wp-content/uploads/sites/33/2023/10/swanson-logo.png" alt="Swanson Logo" style="height:50px;background:#fff;border-radius:6px;padding:4px;">
  <h1><span>Swanson</span> Swim Team 2026</h1>
  <div class="header-stats" id="headerStats"></div>
</header>

<nav id="mainNav">
  <button class="active" data-tab="results">All Results</button>
  <button data-tab="swimmers">Swimmer Profiles</button>
  <button data-tab="finals">Best by Events</button>
  <button data-tab="champs" style="color:#c9a84c;font-weight:700">🏆 Championship</button>
</nav>

<main>

  <div class="section active" id="sec-results">

      <label>Event:</label><select id="fEvent"><option value="">All</option></select>
      <label>Gender:</label><select id="fGender"><option value="">All</option><option>Boys</option><option>Girls</option></select>
      <label>Swimmer:</label><input id="fSwimmer" placeholder="Search..." />
    </div>
    <div class="table-wrapper">
      <table id="resultsTable"></table>
    </div>
  </div>

  <!-- SWIMMER PROFILES -->
  <div class="section" id="sec-swimmers">
    <div class="filters">
      <label>Gender:</label><select id="spGender"><option value="">All</option><option>Boys</option><option>Girls</option></select>
      <label>Search:</label><input id="spSearch" placeholder="Name..." />
    </div>
    <div class="table-wrapper">
      <table id="swimmersTable"></table>
    </div>
  </div>

  <!-- CHAMPIONSHIP -->
  <div class="section" id="sec-champs"></div>

  <!-- BEST BY EVENTS -->
  <div class="section" id="sec-finals">
    <h2 style="color:var(--navy);margin-bottom:0.5rem;padding-bottom:0.5rem;border-bottom:3px solid var(--gold);">Boys</h2>
    <div class="finals-grid" id="finalsGridBoys"></div>
    <h2 style="color:var(--navy);margin:1.5rem 0 0.5rem;padding-bottom:0.5rem;border-bottom:3px solid var(--gold);">Girls</h2>
    <div class="finals-grid" id="finalsGridGirls"></div>
  </div>
</main>

<!-- Swimmer modal -->
<div class="modal-overlay" id="swimmerModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

function loadData() { init(); }

// ============================================================
// UTILITIES
// ============================================================
const EVENTS = {};
const MEETS_ORDER = [];
const SWIMMERS = {};

function init() {
  // Build indexes
  const meetSet = new Set();
  DATA.forEach(r => {
    const ek = r.event_number;
    if (!EVENTS[ek]) EVENTS[ek] = { number: ek, name: r.event_name, gender: r.gender, type: r.event_type, distance: r.distance, stroke: r.stroke };
    meetSet.add(r.meet_date);
    if (!r.dq) {
      const sk = r.swimmer_canonical;
      if (!SWIMMERS[sk]) SWIMMERS[sk] = { canonical: sk, display: r.swimmer_display, gender: r.gender, results: [] };
      SWIMMERS[sk].results.push(r);
    }
  });
  MEETS_ORDER.push(...[...meetSet].sort());

  // Header stats
  document.getElementById('headerStats').innerHTML = `
    <span>${Object.keys(SWIMMERS).length} Swimmers</span>
    <span>${MEETS_ORDER.length} Meets</span>
    <span>${DATA.filter(r=>!r.dq).length} Results</span>
  `;

  // Populate filters
  populateFilters();

  // Render all sections
  renderResults();
  renderSwimmers();
  renderFinals();
  renderChampionship();

  // Tab navigation
  document.querySelectorAll('#mainNav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#mainNav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('sec-' + btn.dataset.tab).classList.add('active');
    });
  });
}

function populateFilters() {
  const fMeet = document.getElementById('fMeet');
  MEETS_ORDER.forEach(d => {
    const opp = DATA.find(r => r.meet_date === d)?.opponent || d;
    fMeet.innerHTML += `<option value="${d}">${d} vs ${opp}</option>`;
  });

  const fEvent = document.getElementById('fEvent');
  Object.values(EVENTS).sort((a,b) => a.number - b.number).forEach(e => {
    fEvent.innerHTML += `<option value="${e.number}">E${e.number} ${e.gender} ${e.name}</option>`;
  });
}

function fmtTime(secs) {
  if (secs == null) return '-';
  if (secs >= 60) {
    const m = Math.floor(secs / 60);
    const s = secs - m * 60;
    return `${m}:${s < 10 ? '0' : ''}${s.toFixed(2)}`;
  }
  return secs.toFixed(2);
}

function getBestTime(canonical, eventNum) {
  const s = SWIMMERS[canonical];
  if (!s) return null;
  const times = s.results.filter(r => r.event_number === eventNum && r.time_seconds != null).map(r => r.time_seconds);
  return times.length ? Math.min(...times) : null;
}

function openSwimmerProfile(canonical) {
  const s = SWIMMERS[canonical];
  if (!s) return;

  // Group results by event
  const byEvent = {};
  s.results.forEach(r => {
    if (!byEvent[r.event_number]) byEvent[r.event_number] = [];
    byEvent[r.event_number].push(r);
  });

  let html = `<h2>${s.display}</h2><p style="color:var(--gray);margin-bottom:1rem;">${s.gender} | Events: ${Object.keys(byEvent).length}</p>`;

  Object.keys(byEvent).sort((a,b) => +a - +b).forEach(en => {
    const evResults = byEvent[en].sort((a,b) => MEETS_ORDER.indexOf(a.meet_date) - MEETS_ORDER.indexOf(b.meet_date));
    const best = Math.min(...evResults.filter(r=>r.time_seconds!=null).map(r=>r.time_seconds));
    const ev = EVENTS[en];
    html += `<div style="margin-bottom:1rem;">`;
    html += `<h3 style="color:var(--navy);font-size:0.95rem;">E${en} ${ev.name} (Best: ${fmtTime(best)})</h3>`;
    html += `<table><tr><th>Date</th><th>Opponent</th><th>Time</th></tr>`;
    evResults.forEach(r => {
      const isBest = r.time_seconds === best;
      html += `<tr>
        <td>${r.meet_date}</td>
        <td>${r.opponent}</td>
        <td>${r.dq ? 'DQ' : fmtTime(r.time_seconds)}${isBest && !r.dq ? '<span class="best-badge">PB</span>' : ''}</td>
      </tr>`;
    });
    html += `</table></div>`;
  });

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('swimmerModal').classList.add('show');
}

function closeModal() {
  document.getElementById('swimmerModal').classList.remove('show');
}
document.getElementById('swimmerModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

function renderResults() {
  const render = () => {
    const meetFilter = document.getElementById('fMeet').value;
    const eventFilter = document.getElementById('fEvent').value;
    const genderFilter = document.getElementById('fGender').value;
    const swimmerFilter = document.getElementById('fSwimmer').value.toLowerCase();

    let filtered = [...DATA];
    if (meetFilter) filtered = filtered.filter(r => r.meet_date === meetFilter);
    if (eventFilter) filtered = filtered.filter(r => r.event_number === +eventFilter);
    if (genderFilter) filtered = filtered.filter(r => r.gender === genderFilter);
    if (swimmerFilter) filtered = filtered.filter(r => r.swimmer_display.toLowerCase().includes(swimmerFilter));

    let html = `<tr><th>Date</th><th>Opponent</th><th>Event</th><th>Swimmer</th><th>Time</th></tr>`;
    filtered.forEach(r => {
      const best = getBestTime(r.swimmer_canonical, r.event_number);
      const isBest = r.time_seconds != null && r.time_seconds === best;
      html += `<tr class="${r.dq ? 'dq' : ''}">
        <td>${r.meet_date}</td>
        <td>${r.opponent}</td>
        <td>E${r.event_number} ${r.event_name}</td>
        <td><span class="swimmer-link" onclick="openSwimmerProfile('${r.swimmer_canonical}')">${r.swimmer_display}</span></td>
        <td>${r.dq ? 'DQ' : fmtTime(r.time_seconds)}${isBest && !r.dq ? '<span class="best-badge">PB</span>' : ''}</td>
      </tr>`;
    });
    document.getElementById('resultsTable').innerHTML = html;
  };

  ['fMeet','fEvent','fGender'].forEach(id => document.getElementById(id).addEventListener('change', render));
  document.getElementById('fSwimmer').addEventListener('input', render);
  render();
}

// ============================================================
// SWIMMER PROFILES LIST
// ============================================================
function renderSwimmers() {
  const render = () => {
    const genderFilter = document.getElementById('spGender').value;
    const searchFilter = document.getElementById('spSearch').value.toLowerCase();

    let swimmers = Object.values(SWIMMERS);
    if (genderFilter) swimmers = swimmers.filter(s => s.gender === genderFilter);
    if (searchFilter) swimmers = swimmers.filter(s => s.display.toLowerCase().includes(searchFilter));

    swimmers.sort((a,b) => a.display.localeCompare(b.display));

    // For each swimmer, compute stats
    let html = `<tr><th>Swimmer</th><th>Gender</th><th>Events</th><th>Total Results</th><th>Meets</th></tr>`;
    swimmers.forEach(s => {
      const events = new Set(s.results.map(r => r.event_number));
      const meets = new Set(s.results.map(r => r.meet_date)).size;

      html += `<tr>
        <td><span class="swimmer-link" onclick="openSwimmerProfile('${s.canonical}')">${s.display}</span></td>
        <td>${s.gender}</td>
        <td>${events.size}</td>
        <td>${s.results.length}</td>
        <td>${meets}</td>
      </tr>`;
    });
    document.getElementById('swimmersTable').innerHTML = html;
  };

  document.getElementById('spGender').addEventListener('change', render);
  document.getElementById('spSearch').addEventListener('input', render);
  render();
}

// ============================================================
// FINALS SELECTION
// ============================================================
function renderFinals() {
  ['Boys', 'Girls'].forEach(gender => {
    const grid = document.getElementById(gender === 'Boys' ? 'finalsGridBoys' : 'finalsGridGirls');
    grid.innerHTML = '';

    const events = Object.values(EVENTS)
      .filter(e => e.gender === gender && e.type === 'individual')
      .sort((a,b) => a.number - b.number);

    events.forEach(ev => {
      const swimmerBests = [];
      Object.values(SWIMMERS).forEach(s => {
        if (s.gender !== gender) return;
        const best = getBestTime(s.canonical, ev.number);
        if (best != null) {
          const meetCount = new Set(s.results.filter(r => r.event_number === ev.number).map(r => r.meet_date)).size;
          const latest = s.results
            .filter(r => r.event_number === ev.number && r.time_seconds != null)
            .sort((a,b) => MEETS_ORDER.indexOf(b.meet_date) - MEETS_ORDER.indexOf(a.meet_date))[0];

          swimmerBests.push({
            canonical: s.canonical,
            display: s.display,
            bestTime: best,
            latestTime: latest ? latest.time_seconds : null,
            meetCount: meetCount,
          });
        }
      });

      swimmerBests.sort((a,b) => a.bestTime - b.bestTime);

      const div = document.createElement('div');
      div.className = 'finals-event';
      let html = `<h3>E${ev.number} ${ev.name} (${ev.distance}yd ${ev.stroke})</h3>`;
      html += `<table><tr><th class="rank">#</th><th>Swimmer</th><th>Best</th><th>Latest</th><th>Meets</th></tr>`;
      swimmerBests.forEach((sb, i) => {
        html += `<tr class="finals-row" data-canonical="${sb.canonical}" onclick="toggleFinalsSelect(this)">
          <td class="rank">${i+1}</td>
          <td><span class="swimmer-link" onclick="event.stopPropagation();openSwimmerProfile('${sb.canonical}')">${sb.display}</span></td>
          <td><strong>${fmtTime(sb.bestTime)}</strong></td>
          <td>${fmtTime(sb.latestTime)}</td>
          <td>${sb.meetCount}</td>
        </tr>`;
      });
      html += `</table>`;
      div.innerHTML = html;
      grid.appendChild(div);
    });
  });
}

function toggleFinalsSelect(tr) {
  tr.classList.toggle('selected');
  tr.querySelectorAll('td').forEach(td => td.classList.toggle('selected'));
}

    {name:'Tenley Bretzfield',g:'G',results:[{ev:'E12 25 Breast',p:5,t:'17.62',pts:18},{ev:'E20 50 Breast',p:6,t:'40.28',pts:17},{ev:'E4 100 Free',p:11,t:'1:11.90',pts:12}]},
    {name:'Kiley Youngdahl',g:'G',results:[{ev:'E8 25 Free',p:8,t:'14.34',pts:15},{ev:'E10 25 Fly',p:11,t:'15.52',pts:12},{ev:'E14 25 Back',p:17,t:'19.85',pts:6}]},
    {name:'Joaquin Erraez',g:'B',results:[{ev:'E7 25 Free',p:8,t:'13.53',pts:15},{ev:'E15 50 Free',p:13,t:'30.15',pts:10},{ev:'E3 100 Free',p:15,t:'1:07.26',pts:8}]},
    {name:'Natalie Sottile',g:'G',results:[{ev:'E8 25 Free',p:10,t:'14.43',pts:13},{ev:'E4 100 Free',p:10,t:'1:10.31',pts:13},{ev:'E16 50 Free',p:12,t:'31.53',pts:11}]},
    {name:'Nate Ervin',g:'B',results:[{ev:'E5 100 IM',p:15,t:'1:25.25',pts:8},{ev:'E9 25 Fly',p:17,t:'15.88',pts:6}]},
    {name:'Eleanor Fiegel',g:'G',results:[{ev:'E18 50 Back',p:9,t:'37.50',pts:14},{ev:'E20 50 Breast',p:15,t:'45.17',pts:8},{ev:'E12 25 Breast',p:17,t:'20.75',pts:6}]},
    {name:'Elsa Jackson',g:'G',results:[{ev:'E20 50 Breast',p:11,t:'42.92',pts:12},{ev:'E12 25 Breast',p:12,t:'19.06',pts:11}]},
    {name:'Peter Woodworth',g:'B',results:[{ev:'E13 25 Back',p:9,t:'16.38',pts:14}]},
    {name:'Logan Vu',g:'B',results:[{ev:'E17 50 Back',p:10,t:'38.42',pts:13}]},
    {name:'AJ Graldo',g:'B',results:[{ev:'E7 25 Free',p:12,t:'14.19',pts:10.5},{ev:'E13 25 Back',p:14,t:'18.47',pts:9}]},
    {name:'Derek Graham',g:'B',results:[{ev:'E13 25 Back',p:13,t:'18.25',pts:10},{ev:'E17 50 Back',p:13,t:'41.84',pts:10}]},
    {name:'William Pandya',g:'B',results:[{ev:'E19 50 Breast',p:12,t:'39.03',pts:11}]},
  ];

  const fmt = t => {
    if (typeof t === 'string') return t;
    if (t >= 60) { const m=Math.floor(t/60), s=(t-m*60).toFixed(2).padStart(5,'0'); return `${m}:${s}`; }
    return t.toFixed(2);
  };
  const placeBadge = p => {
    const cls = p===1?'b1':p===2?'b2':p===3?'b3':'bx';
    const lbl = p===1?'1st':p===2?'2nd':p===3?'3rd':`${p}th`;
    return `<span class="badge ${cls}">${lbl}</span>`;
  };

  const el = document.getElementById('sec-champs');
  const maxPts = TEAMS[0].pts;

  // ── Hero ──
  el.innerHTML = `
  <div class="champ-hero">
    <div class="champ-trophy">🏆</div>
    <div class="champ-title">
      <h2>APS Championship Champions!</h2>
      <p>APS Middle School Swimming Championship · April 16, 2026 · 6 schools</p>
    </div>
    <div class="champ-score-box">
      <div class="big">1,219.5</div>
      <div class="lbl">Swanson Points</div>
    </div>
    <div class="champ-score-box">
      <div class="big">+29</div>
      <div class="lbl">Margin over 2nd place</div>
    </div>
  </div>`;

  // ── Podium ──
  el.innerHTML += `
  <div style="text-align:center;margin-bottom:1.5rem">
    <h3 style="color:var(--navy);font-size:1.1rem;margin-bottom:1.2rem">Team Standings</h3>
    <div class="podium-wrap" style="margin:0 auto">
      <div class="pod">
        <div class="pod-name">Dorothy Hamm</div>
        <div class="pod-pts" style="color:#95a5a6">1,190.5</div>
        <div class="pod-sub">pts</div>
        <div class="pod-stand pod-2">2</div>
      </div>
      <div class="pod">
        <div class="pod-name" style="color:var(--gold);font-size:1rem">🏆 Swanson</div>
        <div class="pod-pts" style="color:var(--gold);font-size:1.9rem">1,219.5</div>
        <div class="pod-sub">pts</div>
        <div class="pod-stand pod-1">1</div>
      </div>
      <div class="pod">
        <div class="pod-name">Williamsburg</div>
        <div class="pod-pts" style="color:#cd7f32">1,009.5</div>
        <div class="pod-sub">pts</div>
        <div class="pod-stand pod-3">3</div>
      </div>
    </div>
  </div>`;

  // ── Standings table ──
  let thtml = `<table class="standings-table"><thead><tr>
    <th>#</th><th>School</th><th>Points</th><th>Score bar</th><th>vs Swanson</th>
  </tr></thead><tbody>`;
  const medals = ['🥇','🥈','🥉','4','5','6'];
  TEAMS.forEach((t,i) => {
    const pct = (t.pts/maxPts*100).toFixed(1);
    const diff = i===0 ? '—' : (t.pts - maxPts).toFixed(1);
    const color = SCHOOL_COLOR[t.name]||'#555';
    thtml += `<tr class="${t.name==='Swanson'?'row-swanson':''}">
      <td style="font-weight:800;font-size:1.05rem">${medals[i]}</td>
      <td><span class="sdot" style="background:${color}"></span>${t.name}</td>
      <td style="font-weight:700">${t.pts.toLocaleString()}</td>
      <td><div class="bar-bg"><div class="bar-fg" style="width:${pct}%;background:${color}"></div></div></td>
      <td style="font-size:.85rem;color:var(--gray)">${diff}</td>
    </tr>`;
  });
  thtml += `</tbody></table>`;
  el.innerHTML += thtml;

  // ── Swanson swimmers section ──
  el.innerHTML += `<h3 style="color:var(--navy);font-size:1.1rem;margin:1.5rem 0 .5rem">Swanson Swimmers — Individual Results</h3>`;
  const swimGrid = document.createElement('div');
  swimGrid.className = 'champ-swimmers-grid';
  const sortedSw = [...SWIMMERS_CHAMP].sort((a,b)=>{
    const sa=a.results.reduce((x,r)=>x+r.pts,0), sb=b.results.reduce((x,r)=>x+r.pts,0);
    return sb-sa;
  });
  sortedSw.forEach(sw => {
    const total = sw.results.reduce((x,r)=>x+r.pts,0);
    const wins  = sw.results.filter(r=>r.p===1).length;
    const div = document.createElement('div');
    div.className = 'csw-card' + (wins>0?' gold':'');
    div.innerHTML = `
      <div class="csw-name">${sw.g==='G'?'👧':'👦'} ${sw.name}</div>
      <div class="csw-events">${sw.results.map(r=>`
        <div class="csw-row">
          <span class="csw-ev-name">${r.ev}</span>
          ${placeBadge(r.p)}
          <span class="csw-time">${r.t}</span>
          <span class="csw-pts">+${r.pts}</span>
        </div>`).join('')}
      </div>
      <div class="csw-footer"><strong>${total.toFixed(1)} pts</strong> · ${sw.results.length} event${sw.results.length>1?'s':''}${wins?` · ${wins} win${wins>1?'s':''} 🥇`:''}</div>`;
    swimGrid.appendChild(div);
  });
  el.appendChild(swimGrid);

  // ── Bar charts ──
  el.innerHTML += `<h3 style="color:var(--navy);font-size:1.1rem;margin:1.5rem 0 .5rem">Event Times — Top 8 per Event</h3>
  <p style="font-size:.82rem;color:var(--gray);margin-bottom:.8rem">Bars proporcionales al tiempo — barra más corta = más rápido. Swanson con borde.</p>
  <div class="champ-legend" id="champLegend"></div>`;

  const legEl = document.getElementById('champLegend');
  Object.entries(SCHOOL_COLOR).forEach(([sc,col])=>{
    legEl.innerHTML += `<div class="champ-legend-item"><div class="sdot" style="background:${col};width:13px;height:13px;border-radius:3px"></div>${sc}</div>`;
  });

  const chartGrid = document.createElement('div');
  chartGrid.className = 'ev-charts-grid';
  CHART_EVENTS.forEach(ev => {
    const times = ev.entries.map(e=>e.t);
    const maxT = Math.max(...times), minT = Math.min(...times);
    const rows = ev.entries.map(e=>{
      const ratio = maxT===minT ? 1 : (e.t-minT)/(maxT-minT);
      const pct = (97 - ratio*(97-40)).toFixed(1);
      const col = SCHOOL_COLOR[e.s]||'#555';
      const isS = e.s==='Swanson';
      const medal = e.p===1?'🥇':e.p===2?'🥈':e.p===3?'🥉':e.p;
      const gc = e.p===1?'g1':e.p===2?'g2':e.p===3?'g3':'';
      return `<div class="ch-bar-row">
        <span class="ch-place ${gc}">${medal}</span>
        <span class="ch-name ${isS?'swan':''}" title="${e.n} — ${e.s}">${e.n}</span>
        <div class="ch-track">
          <div class="ch-fill ${isS?'swan-border':''}" style="width:${pct}%;background:${col}">${SHORT[e.s]||''}</div>
        </div>
        <span class="ch-time">${fmt(e.t)}</span>
      </div>`;
    }).join('');
    const card = document.createElement('div');
    card.className = 'ev-chart-card';
    card.innerHTML = `
      <div class="ev-chart-head">
        <span class="ech-name">${ev.name}</span>
        <span class="ech-ev">${ev.ev}</span>
      </div>
      <div class="ev-chart-body">${rows}</div>`;
    chartGrid.appendChild(card);
  });
  el.appendChild(chartGrid);
}

// ============================================================

loadData();
</script>
