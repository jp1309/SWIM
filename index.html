<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swanson Swim Team Dashboard</title>
<style>
  :root {
    --navy: #1a2744;
    --gold: #c9a84c;
    --light: #f4f6f9;
    --white: #fff;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
    --gray: #7f8c8d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--light); color: #333; }

  header {
    background: var(--navy);
    color: var(--white);
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
  }
  header h1 { font-size: 1.6rem; }
  header h1 span { color: var(--gold); }
  .header-stats { display: flex; gap: 2rem; font-size: 0.9rem; opacity: 0.85; }

  nav {
    background: var(--white);
    border-bottom: 2px solid var(--gold);
    display: flex;
    gap: 0;
    overflow-x: auto;
  }
  nav button {
    padding: 0.8rem 1.5rem;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--gray);
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
  }
  nav button:hover { color: var(--navy); }
  nav button.active { color: var(--navy); border-bottom-color: var(--gold); }

  main { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }

  .section { display: none; }
  .section.active { display: block; }

  /* Cards grid */


  /* Tables */
  .table-wrapper {
    background: var(--white);
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    overflow-x: auto;
    margin-bottom: 1.5rem;
  }
  .table-wrapper h2 {
    padding: 1rem 1.2rem 0.5rem;
    font-size: 1.1rem;
    color: var(--navy);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  th {
    background: var(--navy);
    color: var(--white);
    padding: 0.6rem 0.8rem;
    text-align: left;
    font-weight: 500;
    position: sticky;
    top: 0;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { background: #243b5e; }
  td {
    padding: 0.5rem 0.8rem;
    border-bottom: 1px solid #eee;
    white-space: nowrap;
  }
  tr:hover td { background: #f0f4ff; }
  tr.dq td { color: var(--red); text-decoration: line-through; opacity: 0.7; }
  .time-best { color: var(--green); font-weight: 600; }
  .time-improve { color: var(--blue); }

  /* Filters */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 0.8rem;
    margin-bottom: 1.2rem;
    align-items: center;
  }
  .filters label { font-size: 0.85rem; font-weight: 500; color: var(--navy); }
  .filters select, .filters input {
    padding: 0.4rem 0.6rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.88rem;
  }

  /* Best times highlight */
  .best-badge {
    display: inline-block;
    background: var(--green);
    color: white;
    font-size: 0.7rem;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    font-weight: 600;
    margin-left: 0.3rem;
  }
  .pb-badge {
    display: inline-block;
    background: var(--blue);
    color: white;
    font-size: 0.7rem;
    padding: 0.15rem 0.4rem;
    border-radius: 3px;
    font-weight: 600;
    margin-left: 0.3rem;
  }

  /* Finals selection */
  .finals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 1rem; }
  .finals-event {
    background: var(--white);
    border-radius: 8px;
    padding: 1rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .finals-event h3 {
    color: var(--navy);
    font-size: 0.95rem;
    margin-bottom: 0.5rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid var(--gold);
  }
  .finals-event .rank { width: 28px; text-align: center; font-weight: 700; color: var(--navy); }
  .finals-event td.selected { background: #e8f5e9; }
  .finals-event tr.recommended td { }

  .trend-dot {
    width: 6px; height: 6px; border-radius: 50%;
    display: inline-block;
  }

  .print-btn {
    padding: 0.5rem 1.2rem;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .print-btn:hover { background: #243b5e; }

  @media print {
    nav, .filters, .print-btn, header { display: none !important; }
    .section { display: block !important; }
    .table-wrapper { break-inside: avoid; }
  }

  .swimmer-link { color: var(--blue); cursor: pointer; text-decoration: underline; }
  .swimmer-link:hover { color: var(--navy); }

  /* Swimmer profile modal */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    justify-content: center;
    align-items: flex-start;
    padding-top: 5vh;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: white;
    border-radius: 8px;
    width: 90%;
    max-width: 800px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 1.5rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  .modal h2 { color: var(--navy); margin-bottom: 1rem; }
  .modal-close {
    float: right;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--gray);
  }
</style>
</head>
<body>

<header>
  <img src="https://swanson.apsva.us/wp-content/uploads/sites/33/2023/10/swanson-logo.png" alt="Swanson Logo" style="height:50px;background:#fff;border-radius:6px;padding:4px;">
  <h1><span>Swanson</span> Swim Team 2026</h1>
  <div class="header-stats" id="headerStats"></div>
</header>

<nav id="mainNav">
  <button class="active" data-tab="results">All Results</button>
  <button data-tab="swimmers">Swimmer Profiles</button>
  <button data-tab="finals">Best by Events</button>
</nav>

<main>
  <!-- ALL RESULTS -->
  <div class="section active" id="sec-results">
    <div class="filters">
      <label>Meet:</label><select id="fMeet"><option value="">All</option></select>
      <label>Event:</label><select id="fEvent"><option value="">All</option></select>
      <label>Gender:</label><select id="fGender"><option value="">All</option><option>Boys</option><option>Girls</option></select>
      <label>Swimmer:</label><input id="fSwimmer" placeholder="Search..." />
    </div>
    <div class="table-wrapper">
      <table id="resultsTable"></table>
    </div>
  </div>

  <!-- SWIMMER PROFILES -->
  <div class="section" id="sec-swimmers">
    <div class="filters">
      <label>Gender:</label><select id="spGender"><option value="">All</option><option>Boys</option><option>Girls</option></select>
      <label>Search:</label><input id="spSearch" placeholder="Name..." />
    </div>
    <div class="table-wrapper">
      <table id="swimmersTable"></table>
    </div>
  </div>

  <!-- FINALS SELECTION -->
  <div class="section" id="sec-finals">
    <div class="filters">
      <label>Gender:</label>
      <select id="finalsGender"><option>Boys</option><option>Girls</option></select>
      <button class="print-btn" onclick="window.print()">Print Selection</button>
    </div>
    <div class="finals-grid" id="finalsGrid"></div>
  </div>
</main>

<!-- Swimmer modal -->
<div class="modal-overlay" id="swimmerModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

// ============================================================
// UTILITIES
// ============================================================
const EVENTS = {};
const MEETS_ORDER = [];
const SWIMMERS = {};

function init() {
  // Build indexes
  const meetSet = new Set();
  DATA.forEach(r => {
    const ek = r.event_number;
    if (!EVENTS[ek]) EVENTS[ek] = { number: ek, name: r.event_name, gender: r.gender, type: r.event_type, distance: r.distance, stroke: r.stroke };
    meetSet.add(r.meet_date);
    if (!r.dq) {
      const sk = r.swimmer_canonical;
      if (!SWIMMERS[sk]) SWIMMERS[sk] = { canonical: sk, display: r.swimmer_display, gender: r.gender, results: [] };
      SWIMMERS[sk].results.push(r);
    }
  });
  MEETS_ORDER.push(...[...meetSet].sort());

  // Header stats
  document.getElementById('headerStats').innerHTML = `
    <span>${Object.keys(SWIMMERS).length} Swimmers</span>
    <span>${MEETS_ORDER.length} Meets</span>
    <span>${DATA.filter(r=>!r.dq).length} Results</span>
  `;

  // Populate filters
  populateFilters();

  // Render all sections
  renderResults();
  renderSwimmers();
  renderFinals();

  // Tab navigation
  document.querySelectorAll('#mainNav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#mainNav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('sec-' + btn.dataset.tab).classList.add('active');
    });
  });
}

function populateFilters() {
  const fMeet = document.getElementById('fMeet');
  MEETS_ORDER.forEach(d => {
    const opp = DATA.find(r => r.meet_date === d)?.opponent || d;
    fMeet.innerHTML += `<option value="${d}">${d} vs ${opp}</option>`;
  });

  const fEvent = document.getElementById('fEvent');
  Object.values(EVENTS).sort((a,b) => a.number - b.number).forEach(e => {
    fEvent.innerHTML += `<option value="${e.number}">E${e.number} ${e.gender} ${e.name}</option>`;
  });
}

function fmtTime(secs) {
  if (secs == null) return '-';
  if (secs >= 60) {
    const m = Math.floor(secs / 60);
    const s = secs - m * 60;
    return `${m}:${s < 10 ? '0' : ''}${s.toFixed(2)}`;
  }
  return secs.toFixed(2);
}

function getBestTime(canonical, eventNum) {
  const s = SWIMMERS[canonical];
  if (!s) return null;
  const times = s.results.filter(r => r.event_number === eventNum && r.time_seconds != null).map(r => r.time_seconds);
  return times.length ? Math.min(...times) : null;
}

function openSwimmerProfile(canonical) {
  const s = SWIMMERS[canonical];
  if (!s) return;

  // Group results by event
  const byEvent = {};
  s.results.forEach(r => {
    if (!byEvent[r.event_number]) byEvent[r.event_number] = [];
    byEvent[r.event_number].push(r);
  });

  let html = `<h2>${s.display}</h2><p style="color:var(--gray);margin-bottom:1rem;">${s.gender} | Events: ${Object.keys(byEvent).length}</p>`;

  Object.keys(byEvent).sort((a,b) => +a - +b).forEach(en => {
    const evResults = byEvent[en].sort((a,b) => MEETS_ORDER.indexOf(a.meet_date) - MEETS_ORDER.indexOf(b.meet_date));
    const best = Math.min(...evResults.filter(r=>r.time_seconds!=null).map(r=>r.time_seconds));
    const ev = EVENTS[en];
    html += `<div style="margin-bottom:1rem;">`;
    html += `<h3 style="color:var(--navy);font-size:0.95rem;">E${en} ${ev.name} (Best: ${fmtTime(best)})</h3>`;
    html += `<table><tr><th>Date</th><th>Opponent</th><th>Time</th></tr>`;
    evResults.forEach(r => {
      const isBest = r.time_seconds === best;
      html += `<tr>
        <td>${r.meet_date}</td>
        <td>${r.opponent}</td>
        <td>${r.dq ? 'DQ' : fmtTime(r.time_seconds)}${isBest && !r.dq ? '<span class="best-badge">PB</span>' : ''}</td>
      </tr>`;
    });
    html += `</table></div>`;
  });

  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('swimmerModal').classList.add('show');
}

function closeModal() {
  document.getElementById('swimmerModal').classList.remove('show');
}
document.getElementById('swimmerModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// ============================================================
// ALL RESULTS
// ============================================================
function renderResults() {
  const render = () => {
    const meetFilter = document.getElementById('fMeet').value;
    const eventFilter = document.getElementById('fEvent').value;
    const genderFilter = document.getElementById('fGender').value;
    const swimmerFilter = document.getElementById('fSwimmer').value.toLowerCase();

    let filtered = [...DATA];
    if (meetFilter) filtered = filtered.filter(r => r.meet_date === meetFilter);
    if (eventFilter) filtered = filtered.filter(r => r.event_number === +eventFilter);
    if (genderFilter) filtered = filtered.filter(r => r.gender === genderFilter);
    if (swimmerFilter) filtered = filtered.filter(r => r.swimmer_display.toLowerCase().includes(swimmerFilter));

    let html = `<tr><th>Date</th><th>Opponent</th><th>Event</th><th>Swimmer</th><th>Time</th></tr>`;
    filtered.forEach(r => {
      const best = getBestTime(r.swimmer_canonical, r.event_number);
      const isBest = r.time_seconds != null && r.time_seconds === best;
      html += `<tr class="${r.dq ? 'dq' : ''}">
        <td>${r.meet_date}</td>
        <td>${r.opponent}</td>
        <td>E${r.event_number} ${r.event_name}</td>
        <td><span class="swimmer-link" onclick="openSwimmerProfile('${r.swimmer_canonical}')">${r.swimmer_display}</span></td>
        <td>${r.dq ? 'DQ' : fmtTime(r.time_seconds)}${isBest && !r.dq ? '<span class="best-badge">PB</span>' : ''}</td>
      </tr>`;
    });
    document.getElementById('resultsTable').innerHTML = html;
  };

  ['fMeet','fEvent','fGender'].forEach(id => document.getElementById(id).addEventListener('change', render));
  document.getElementById('fSwimmer').addEventListener('input', render);
  render();
}

// ============================================================
// SWIMMER PROFILES LIST
// ============================================================
function renderSwimmers() {
  const render = () => {
    const genderFilter = document.getElementById('spGender').value;
    const searchFilter = document.getElementById('spSearch').value.toLowerCase();

    let swimmers = Object.values(SWIMMERS);
    if (genderFilter) swimmers = swimmers.filter(s => s.gender === genderFilter);
    if (searchFilter) swimmers = swimmers.filter(s => s.display.toLowerCase().includes(searchFilter));

    swimmers.sort((a,b) => a.display.localeCompare(b.display));

    // For each swimmer, compute stats
    let html = `<tr><th>Swimmer</th><th>Gender</th><th>Events</th><th>Total Results</th><th>Meets</th></tr>`;
    swimmers.forEach(s => {
      const events = new Set(s.results.map(r => r.event_number));
      const meets = new Set(s.results.map(r => r.meet_date)).size;

      html += `<tr>
        <td><span class="swimmer-link" onclick="openSwimmerProfile('${s.canonical}')">${s.display}</span></td>
        <td>${s.gender}</td>
        <td>${events.size}</td>
        <td>${s.results.length}</td>
        <td>${meets}</td>
      </tr>`;
    });
    document.getElementById('swimmersTable').innerHTML = html;
  };

  document.getElementById('spGender').addEventListener('change', render);
  document.getElementById('spSearch').addEventListener('input', render);
  render();
}

// ============================================================
// FINALS SELECTION
// ============================================================
function renderFinals() {
  const render = () => {
    const gender = document.getElementById('finalsGender').value;
    const grid = document.getElementById('finalsGrid');
    grid.innerHTML = '';

    // Individual events for this gender
    const events = Object.values(EVENTS)
      .filter(e => e.gender === gender && e.type === 'individual')
      .sort((a,b) => a.number - b.number);

    events.forEach(ev => {
      // Get all swimmers with times in this event
      const swimmerBests = [];
      Object.values(SWIMMERS).forEach(s => {
        if (s.gender !== gender) return;
        const best = getBestTime(s.canonical, ev.number);
        if (best != null) {
          // Count how many meets they've done this event
          const meetCount = new Set(s.results.filter(r => r.event_number === ev.number).map(r => r.meet_date)).size;
          // Latest time
          const latest = s.results
            .filter(r => r.event_number === ev.number && r.time_seconds != null)
            .sort((a,b) => MEETS_ORDER.indexOf(b.meet_date) - MEETS_ORDER.indexOf(a.meet_date))[0];

          swimmerBests.push({
            canonical: s.canonical,
            display: s.display,
            bestTime: best,
            latestTime: latest ? latest.time_seconds : null,
            meetCount: meetCount,
          });
        }
      });

      swimmerBests.sort((a,b) => a.bestTime - b.bestTime);

      const div = document.createElement('div');
      div.className = 'finals-event';
      let html = `<h3>E${ev.number} ${ev.name} (${ev.distance}yd ${ev.stroke})</h3>`;
      html += `<table><tr><th class="rank">#</th><th>Swimmer</th><th>Best</th><th>Latest</th><th>Meets</th></tr>`;
      swimmerBests.forEach((sb, i) => {
        const rec = i < 4 ? ' recommended' : '';
        html += `<tr class="finals-row${rec}" data-canonical="${sb.canonical}" onclick="toggleFinalsSelect(this)">
          <td class="rank">${i+1}</td>
          <td><span class="swimmer-link" onclick="event.stopPropagation();openSwimmerProfile('${sb.canonical}')">${sb.display}</span></td>
          <td><strong>${fmtTime(sb.bestTime)}</strong></td>
          <td>${fmtTime(sb.latestTime)}</td>
          <td>${sb.meetCount}</td>
        </tr>`;
      });
      html += `</table>`;
      div.innerHTML = html;
      grid.appendChild(div);
    });
  };

  document.getElementById('finalsGender').addEventListener('change', render);
  render();
}

function toggleFinalsSelect(tr) {
  tr.classList.toggle('selected');
  tr.querySelectorAll('td').forEach(td => td.classList.toggle('selected'));
}
